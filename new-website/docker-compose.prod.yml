services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: gunicorn -w 1 -b 0.0.0.0:5000 app:app
    env_file:
      - .env.production
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: unless-stopped
